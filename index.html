<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>めざせ脊髄反射</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
      "Yu Gothic", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 24px;
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sub { font-size: 12px; line-height: 1.5; color: #94a3b8; margin: 0 0 12px; text-align: center; }

  .panel {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 640px;
    margin-bottom: 12px;
  }
  .stat {
    background: #1e293b;
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
    min-width: 0;
  }
  .stat .label { font-size: 10px; color: #94a3b8; }
  .stat .value { font-size: 16px; font-weight: 700; margin-top: 2px; white-space: nowrap; }

  .size-panel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 640px;
    margin-bottom: 12px;
  }
  .size-panel button {
    min-height: 44px;
    padding: 6px 4px;
    border-radius: 999px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .size-panel button.active { background: #0284c7; color: #fff; border-color: #0284c7; }

  #start-btn {
    width: 100%;
    max-width: 640px;
    min-height: 52px;
    border-radius: 12px;
    border: none;
    background: #0284c7;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 12px;
  }
  #start-btn:active { background: #0369a1; }
  #start-btn:disabled { background: #334155; color: #94a3b8; cursor: default; }

  #field {
    position: relative;
    width: 100%;
    max-width: 640px;
    height: 340px;
    background: #1e293b;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #334155;
    transition: height 0.25s ease;
    touch-action: manipulation;
  }
  #field.size-small  { height: 220px; }
  #field.size-medium { height: 340px; }
  #field.size-large  { height: 50dvh; min-height: 400px; }
  #field.size-full   { height: 72dvh; min-height: 420px; }

  #dot {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fca5a5, #ef4444 70%);
    box-shadow: 0 0 16px rgba(239,68,68,0.6);
    cursor: pointer;
    display: none;
    will-change: left, top;
  }
  /* 指で押しやすいよう、見た目より広いタップ領域を確保 */
  #dot::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
  }

  #message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1.5;
    color: #94a3b8;
    text-align: center;
    padding: 0 20px;
    pointer-events: none;
  }

  #result-log {
    width: 100%;
    max-width: 640px;
    margin-top: 16px;
  }
  #result-log h2 { font-size: 13px; color: #94a3b8; margin: 0 0 8px; }
  #log-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #log-list li {
    background: #1e293b;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    color: #cbd5e1;
  }
  #log-list li.fastest { background: #065f46; color: #d1fae5; }

  [hidden] { display: none !important; }
  #menu {
    position: fixed; inset: 0; z-index: 60; background: #0f172a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  #menu h1 { font-size: 26px; margin-bottom: 4px; }
  #menu p { margin: 0 0 12px; font-size: 13px; color: #94a3b8; text-align: center; }
  #menu button {
    width: 100%; max-width: 360px; min-height: 64px; border-radius: 14px; border: none;
    background: #0284c7; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  #menu button small { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; opacity: 0.85; }
  #menu button.vs { background: #be123c; }
  #vs-btn {
    width: 100%; max-width: 640px; min-height: 44px; margin-bottom: 12px;
    border-radius: 12px; border: 1px solid #0284c7; background: transparent;
    color: #7dd3fc; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #vs {
    position: fixed; inset: 0; z-index: 50; background: #0f172a;
    display: flex; flex-direction: column; align-items: center; overflow: auto;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .vs-head { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 640px; margin-bottom: 10px; }
  .vs-head strong { font-size: 18px; }
  #vs-close { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 16px; }
  #vs-lobby { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px; }
  #vs-lobby p { margin: 0; font-size: 13px; line-height: 1.6; color: #94a3b8; }
  #vs-code {
    min-height: 52px; border-radius: 10px; border: 1px solid #334155; background: #1e293b;
    color: #e2e8f0; font-size: 22px; text-align: center; letter-spacing: 6px;
    -webkit-user-select: text; user-select: text;
  }
  #vs-lobby button, #vs-start, #vs-again {
    min-height: 52px; border-radius: 12px; border: none; background: #0284c7;
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #vs-game { flex: 1; width: 100%; max-width: 640px; display: flex; flex-direction: column; min-height: 0; }
  #vs-game .panel { max-width: none; }
  #vs-status { margin: 0 0 10px; font-size: 14px; color: #cbd5e1; text-align: center; min-height: 20px; }
  #vs-start, #vs-again { margin-bottom: 10px; }
  #vs-field {
    position: relative; flex: 1 1 auto; min-height: 240px; background: #1e293b;
    border: 1px solid #334155; border-radius: 16px; overflow: hidden; touch-action: none;
  }
  #vs-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1.5; color: #94a3b8; text-align: center; padding: 0 20px; pointer-events: none;
  }
  #vs-dot {
    position: absolute; width: 60px; height: 60px; border-radius: 50%; display: none;
    background: radial-gradient(circle at 35% 30%, #fca5a5, #ef4444 70%);
    box-shadow: 0 0 16px rgba(239,68,68,0.6);
  }
  #vs-dot.mover { pointer-events: none; }
  #vs-dot.tapper { transition: left 0.06s linear, top 0.06s linear; }
  #vs-dot.tapper::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; }
  #vs-log { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #vs-log li { background: #1e293b; border-radius: 6px; padding: 5px 10px; font-size: 13px; color: #cbd5e1; }

  @media (min-width: 700px) {
    body { padding: 32px 16px; }
    h1 { font-size: 24px; }
    .stat .value { font-size: 20px; }
    #field.size-large { max-width: 900px; height: 560px; }
    #field.size-full { max-width: 1600px; height: 80dvh; }
  }
  /* スマホ: プレイ領域を画面幅いっぱい・残りの縦幅いっぱいに広げる */
  @media (max-width: 699px) {
    .size-panel { display: none; }
    #field,
    #field.size-small,
    #field.size-medium,
    #field.size-large,
    #field.size-full {
      flex: 1 1 auto;
      height: auto;
      min-height: 200px;
      max-width: none;
    }
    #result-log { flex-shrink: 0; margin-top: 10px; }
    #result-log h2 { margin-bottom: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #dot, #field { transition: none; }
  }
</style>
</head>
<body>

<h1>めざせ脊髄反射</h1>
<p class="sub">「スタート」を押すとドットがランダムな場所・タイミングで現れます。<br>現れたらすぐにタップ！</p>

<button id="vs-btn">モード選択に戻る</button>

<div class="panel">
  <div class="stat">
    <div class="label">ラウンド</div>
    <div class="value" id="round-value">0 / 5</div>
  </div>
  <div class="stat">
    <div class="label">直近タイム</div>
    <div class="value" id="last-value">--</div>
  </div>
  <div class="stat">
    <div class="label">平均タイム</div>
    <div class="value" id="avg-value">--</div>
  </div>
</div>

<div class="size-panel" id="size-panel">
  <button data-size="small">小</button>
  <button data-size="medium" class="active">中</button>
  <button data-size="large">大</button>
  <button data-size="full">全画面</button>
</div>

<button id="start-btn">スタート</button>

<div id="field" class="size-medium">
  <div id="message">「スタート」ボタンを押してください</div>
  <div id="dot"></div>
</div>

<div id="result-log">
  <h2>記録</h2>
  <ul id="log-list"></ul>
</div>

<script>
  const TOTAL_ROUNDS = 5;
  const fieldEl = document.getElementById("field");
  const dotEl = document.getElementById("dot");
  const messageEl = document.getElementById("message");
  const startBtn = document.getElementById("start-btn");
  const roundValueEl = document.getElementById("round-value");
  const lastValueEl = document.getElementById("last-value");
  const avgValueEl = document.getElementById("avg-value");
  const logListEl = document.getElementById("log-list");
  const sizePanelEl = document.getElementById("size-panel");

  sizePanelEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-size]");
    if (!btn) return;
    [...sizePanelEl.children].forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    fieldEl.classList.remove("size-small", "size-medium", "size-large", "size-full");
    fieldEl.classList.add("size-" + btn.dataset.size);
  });

  let round = 0;
  let times = [];
  let dotShownAt = 0;
  let waitTimer = null;
  let moveTimer = null;
  let tooSoon = false;

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playChime() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // レトロPC風の和音チャイム（減衰する複数トーンを重ねたオリジナル生成音）
    const notes = [523.25, 659.25, 784.0, 1046.5]; // C5, E5, G5, C6
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;

      const start = now + i * 0.05;
      const peak = 0.18;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 1.4);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 1.5);
    });
  }

  // 移動時の「ヒュッ」という風切り音（ノイズを帯域フィルタで下から上へスイープ）
  let noiseBuf = null;
  function playWhoosh() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.value = 1.5;
    filter.frequency.setValueAtTime(500, now);
    filter.frequency.exponentialRampToValueAtTime(3200, now + 0.22);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start(now, Math.random() * 0.5);
    src.stop(now + 0.27);
  }

  function randomPosition() {
    const fieldRect = fieldEl.getBoundingClientRect();
    const dotSize = dotEl.offsetWidth || 60;
    const x = Math.random() * (fieldRect.width - dotSize);
    const y = Math.random() * (fieldRect.height - dotSize);
    return { x, y };
  }

  let animId = null;
  function stopMotion() {
    clearInterval(moveTimer);
    cancelAnimationFrame(animId);
  }

  // 直線または円弧（2次ベジェ曲線）でランダムに移動する
  function moveDotRandomly() {
    playWhoosh();
    const r = fieldEl.getBoundingClientRect();
    const d = dotEl.offsetWidth || 60;
    const maxX = r.width - d;
    const maxY = r.height - d;
    const p0 = { x: parseFloat(dotEl.style.left) || 0, y: parseFloat(dotEl.style.top) || 0 };
    const p2 = randomPosition();
    const dx = p2.x - p0.x;
    const dy = p2.y - p0.y;
    const dist = Math.hypot(dx, dy) || 1;

    let cx = (p0.x + p2.x) / 2;
    let cy = (p0.y + p2.y) / 2;
    if (Math.random() < 0.75) {
      // 進行方向に垂直な向きへ膨らませて円弧にする（左右ランダム）
      const off = (Math.random() < 0.5 ? -1 : 1) * dist * (0.3 + Math.random() * 0.7);
      cx += (-dy / dist) * off;
      cy += (dx / dist) * off;
    }
    // 制御点をフィールド内に収め、軌道がはみ出さないようにする
    cx = Math.min(Math.max(cx, 0), maxX);
    cy = Math.min(Math.max(cy, 0), maxY);

    const dur = 250;
    const t0 = performance.now();
    cancelAnimationFrame(animId);
    const step = (now) => {
      const t = Math.min((now - t0) / dur, 1);
      const e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      const u = 1 - e;
      const x = u * u * p0.x + 2 * u * e * cx + e * e * p2.x;
      const y = u * u * p0.y + 2 * u * e * cy + e * e * p2.y;
      dotEl.style.left = x + "px";
      dotEl.style.top = y + "px";
      if (t < 1) animId = requestAnimationFrame(step);
    };
    animId = requestAnimationFrame(step);
  }

  function startRound() {
    tooSoon = false;
    dotEl.style.display = "none";
    messageEl.style.display = "flex";
    messageEl.textContent = "準備して...";
    stopMotion();

    const delay = 1000 + Math.random() * 2500;
    waitTimer = setTimeout(() => {
      const pos = randomPosition();
      dotEl.style.left = pos.x + "px";
      dotEl.style.top = pos.y + "px";
      messageEl.style.display = "none";
      dotEl.style.display = "block";
      dotShownAt = performance.now();

      moveTimer = setInterval(moveDotRandomly, 300);
    }, delay);
  }

  function recordResult(ms) {
    times.push(ms);
    lastValueEl.textContent = ms + " ms";
    const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
    avgValueEl.textContent = avg + " ms";

    const li = document.createElement("li");
    li.textContent = "#" + times.length + ": " + ms + " ms";
    logListEl.appendChild(li);

    const fastest = Math.min(...times);
    [...logListEl.children].forEach((li, i) => {
      li.classList.toggle("fastest", times[i] === fastest);
    });
  }

  // タッチの遅延を避けるため pointerdown を使用
  dotEl.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (tooSoon) return;
    const reaction = Math.round(performance.now() - dotShownAt);
    stopMotion();
    playChime();
    recordResult(reaction);
    dotEl.style.display = "none";

    round++;
    roundValueEl.textContent = round + " / " + TOTAL_ROUNDS;

    if (round >= TOTAL_ROUNDS) {
      messageEl.style.display = "flex";
      messageEl.textContent = "終了！お疲れさまでした。もう一度挑戦するにはスタートを押してください。";
      startBtn.disabled = false;
      startBtn.textContent = "もう一度スタート";
    } else {
      startRound();
    }
  });

  fieldEl.addEventListener("pointerdown", (e) => {
    if (e.target === dotEl) return;
    if (dotEl.style.display === "none" && round < TOTAL_ROUNDS && startBtn.disabled && !tooSoon) {
      tooSoon = true;
      clearTimeout(waitTimer);
      messageEl.style.display = "flex";
      messageEl.textContent = "早すぎます！ドットが出てからタップしてください。";
      setTimeout(() => startRound(), 1200);
    }
  });

  startBtn.addEventListener("click", () => {
    getAudioCtx();
    round = 0;
    times = [];
    logListEl.innerHTML = "";
    lastValueEl.textContent = "--";
    avgValueEl.textContent = "--";
    roundValueEl.textContent = "0 / " + TOTAL_ROUNDS;
    startBtn.disabled = true;
    startBtn.textContent = "プレイ中...";
    startRound();
  });
</script>

<div id="menu">
  <h1>めざせ脊體反射</h1>
  <p>モードを選んでください</p>
  <button id="menu-solo">一人用<small>出てきた赤丸をすばやくタップして反応速度を計測</small></button>
  <button id="menu-vs" class="vs">2台で対戦<small>一方が赤丸を動かし、もう一方が捕まえる</small></button>
</div>

<div id="vs" hidden>
  <div class="vs-head"><strong>対戦モード</strong><button id="vs-close" aria-label="閉じる">✕</button></div>
  <div id="vs-lobby">
    <p>2人で同じ4文字の合言葉を入れて、役割を分けて入室します。同じClaudeアカウントの組織内か、招待された人同士で遊べます。</p>
    <input id="vs-code" inputmode="latin" maxlength="4" placeholder="合言葉" autocomplete="off" />
    <button data-role="m">赤丸を動かす側で入る</button>
    <button data-role="t">赤丸を押す側で入る</button>
    <p id="vs-lobby-msg"></p>
  </div>
  <div id="vs-game" hidden>
    <div class="panel">
      <div class="stat"><div class="label">ラウンド</div><div class="value" id="vs-round">0 / 5</div></div>
      <div class="stat"><div class="label">捕まえた</div><div class="value" id="vs-hits">0</div></div>
      <div class="stat"><div class="label">役割</div><div class="value" id="vs-role">--</div></div>
    </div>
    <p id="vs-status"></p>
    <button id="vs-start" hidden>スタート</button>
    <button id="vs-again" hidden>もう一度（ロビーへ）</button>
    <div id="vs-field"><div id="vs-msg"></div><div id="vs-dot"></div></div>
    <ul id="vs-log"></ul>
  </div>
</div>

<script>
(function () {
  const TOTAL = 5;
  const $ = (id) => document.getElementById(id);
  const vs = $("vs"), lobby = $("vs-lobby"), game = $("vs-game"), lobbyMsg = $("vs-lobby-msg");
  const statusEl = $("vs-status"), startBtn = $("vs-start"), againBtn = $("vs-again");
  const field = $("vs-field"), msgEl = $("vs-msg"), dot = $("vs-dot"), logEl = $("vs-log");
  const roundEl = $("vs-round"), hitEl = $("vs-hits"), roleEl = $("vs-role");
  let room = null, role = null, rid = 0, phase = "lobby", handled = 0;
  let resolved = false, t0 = 0, tmo = null, log = [], lastOpp = null, dragging = false;
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

  const menu = $("menu");
  $("menu-solo").addEventListener("click", () => { getAudioCtx(); menu.hidden = true; });
  $("menu-vs").addEventListener("click", () => { menu.hidden = true; vs.hidden = false; });
  $("vs-btn").addEventListener("click", () => { menu.hidden = false; });
  $("vs-close").addEventListener("click", () => { toLobby(); vs.hidden = true; menu.hidden = false; });
  againBtn.addEventListener("click", toLobby);
  document.querySelectorAll("#vs-lobby [data-role]").forEach((b) =>
    b.addEventListener("click", () => enter(b.dataset.role)));

  function toLobby() {
    clearTimeout(tmo);
    if (room) { room.leave().catch(() => {}); room = null; }
    role = null; rid = 0; phase = "lobby"; handled = 0; resolved = false;
    log = []; lastOpp = null; dragging = false;
    dot.style.display = "none"; logEl.innerHTML = "";
    againBtn.hidden = true; startBtn.hidden = true;
    roundEl.textContent = "0 / " + TOTAL; hitEl.textContent = "0";
    game.hidden = true; lobby.hidden = false;
  }

  async function enter(r) {
    const code = $("vs-code").value.trim().toLowerCase();
    if (!/^[a-z0-9]{4}$/.test(code)) { lobbyMsg.textContent = "合言葉は半角の英数字4文字で入力してください"; return; }
    if (!window.claude || !window.claude.use) { lobbyMsg.textContent = "対戦機能は、Claudeで公開されたページでのみ使えます"; return; }
    getAudioCtx();
    lobbyMsg.textContent = "接続中...";
    try {
      const rm = await window.claude.use("room");
      if (!rm) { lobbyMsg.textContent = "対戦機能を使えません。Claudeにログインした状態で、共有されたリンクを開いてください"; return; }
      room = await rm.join("reflex-" + code);
      role = r;
      room.onPeers(onPeers);
      await room.presence(r === "m" ? { role: "m", rid: 0, phase: "lobby", on: false } : { role: "t", hit: null, log: [] });
    } catch (e) {
      lobbyMsg.textContent = "入室できませんでした（" + ((e && e.code) || "error") + "）";
      room = null; role = null; return;
    }
    lobby.hidden = true; game.hidden = false; lobbyMsg.textContent = "";
    dot.className = r === "m" ? "mover" : "tapper";
    roleEl.textContent = r === "m" ? "動かす" : "押す";
    statusEl.textContent = "相手を待っています（合言葉: " + code + "）";
    msgEl.style.display = "flex"; msgEl.textContent = "相手の入室を待っています...";
    onPeers({ peers: room.peers() });
  }

  function onPeers(ch) {
    if (!room) return;
    // 同じアカウントの別端末もisMeになるため、このページ（タブ）自身だけをsameTabで除外する
    const opp = ch.peers.find((p) => !p.sameTab && p.presence && p.presence.role);
    if (!opp) {
      if (phase !== "end") statusEl.textContent = "相手を待っています";
      return;
    }
    const pr = opp.presence;
    if (pr.role === role) { statusEl.textContent = "相手も同じ役割です。どちらかが入り直してください"; return; }
    if (role === "m") moverSees(pr); else tapperSees(pr);
  }

  function renderLog(arr) {
    logEl.innerHTML = "";
    let hits = 0;
    arr.forEach((v, i) => {
      const li = document.createElement("li");
      if (typeof v === "number") hits++;
      li.textContent = "#" + (i + 1) + ": " + (typeof v === "number" ? v + " ms" : "逃げ切り");
      logEl.appendChild(li);
    });
    hitEl.textContent = String(hits);
  }

  function finish(arr) {
    const hits = arr.filter((v) => typeof v === "number");
    const avg = hits.length ? Math.round(hits.reduce((a, b) => a + b, 0) / hits.length) : null;
    const text = "終了！ 捕まえた " + hits.length + "/" + TOTAL + "回" + (avg !== null ? "・平均 " + avg + " ms" : "");
    statusEl.textContent = text;
    msgEl.style.display = "flex"; msgEl.textContent = text;
    dot.style.display = "none"; startBtn.hidden = true; againBtn.hidden = false;
    renderLog(arr);
  }

  /* ---- 動かす側 ---- */
  startBtn.addEventListener("click", () => { startBtn.hidden = true; startRound(); });

  function startRound() {
    rid++; phase = "play";
    roundEl.textContent = rid + " / " + TOTAL;
    statusEl.textContent = "画面をドラッグして赤丸を動かし、逃げ切ろう！";
    msgEl.style.display = "flex"; msgEl.textContent = "ドラッグして赤丸を動かす";
    room.presence({ rid: rid, phase: "play", on: false });
  }

  function nextRound() {
    if (!room) return;
    if (rid >= TOTAL) {
      phase = "end";
      room.presence({ phase: "end", on: false });
      finish((lastOpp && lastOpp.log) || []);
    } else {
      startRound();
    }
  }

  function moverSees(pr) {
    lastOpp = pr;
    renderLog(pr.log || []);
    if (phase === "lobby") {
      startBtn.hidden = false;
      statusEl.textContent = "相手が入室しました。スタートを押してください";
      msgEl.textContent = "スタートを押すと開始します";
    }
    const h = pr.hit;
    if (phase === "play" && h && h.rid === rid && handled < rid) {
      handled = rid; dragging = false;
      dot.style.display = "none";
      room.presence({ on: false });
      msgEl.style.display = "flex";
      msgEl.textContent = h.ms == null ? "逃げ切り！" : "捕まった！ " + h.ms + " ms";
      setTimeout(nextRound, 1500);
    }
  }

  function moveTo(e) {
    const rect = field.getBoundingClientRect();
    const d = dot.offsetWidth || 60;
    const x = clamp(e.clientX - rect.left - d / 2, 0, rect.width - d);
    const y = clamp(e.clientY - rect.top - d / 2 - 60, 0, rect.height - d); // 指に隠れないよう少し上に表示
    dot.style.left = x + "px"; dot.style.top = y + "px"; dot.style.display = "block";
    msgEl.style.display = "none";
    room.presence({ x: x / (rect.width - d), y: y / (rect.height - d), on: true });
  }

  field.addEventListener("pointerdown", (e) => {
    if (role !== "m" || phase !== "play" || handled >= rid) return;
    field.setPointerCapture(e.pointerId);
    dragging = true; moveTo(e);
  });
  field.addEventListener("pointermove", (e) => {
    if (role !== "m" || !dragging || phase !== "play" || handled >= rid) return;
    moveTo(e);
  });
  const release = () => {
    if (role !== "m" || !dragging) return;
    dragging = false;
    if (phase === "play" && handled < rid) { dot.style.display = "none"; room.presence({ on: false }); }
  };
  field.addEventListener("pointerup", release);
  field.addEventListener("pointercancel", release);

  /* ---- 押す側 ---- */
  function resolve(ms) {
    if (resolved || !room) return;
    resolved = true; clearTimeout(tmo);
    log[rid - 1] = ms;
    dot.style.display = "none";
    if (ms !== null) playChime();
    msgEl.style.display = "flex";
    msgEl.textContent = ms === null ? "逃げられました" : "捕まえた！ " + ms + " ms";
    renderLog(log);
    room.presence({ hit: { rid: rid, ms: ms }, log: log });
  }

  dot.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (role === "t" && phase === "play" && !resolved) resolve(Math.round(performance.now() - t0));
  });

  function tapperSees(pr) {
    if (phase === "lobby" && !(pr.rid > 0)) {
      statusEl.textContent = "相手が入室しました。スタートを待っています";
      msgEl.textContent = "相手がスタートするのを待っています...";
    }
    if (typeof pr.rid === "number" && pr.rid > rid) {
      rid = pr.rid; phase = "play"; resolved = false; t0 = performance.now();
      clearTimeout(tmo); tmo = setTimeout(() => resolve(null), 15000);
      roundEl.textContent = rid + " / " + TOTAL;
      statusEl.textContent = "赤丸を捕まえろ！（15秒以内）";
      msgEl.style.display = "flex"; msgEl.textContent = "赤丸が出るのを待っています...";
    }
    if (pr.phase === "end" && phase !== "end") {
      phase = "end"; clearTimeout(tmo); finish(log); return;
    }
    if (phase === "play" && !resolved && pr.phase === "play" && pr.on) {
      const rect = field.getBoundingClientRect();
      dot.style.display = "block";
      const d = dot.offsetWidth || 60;
      dot.style.left = clamp(pr.x, 0, 1) * (rect.width - d) + "px";
      dot.style.top = clamp(pr.y, 0, 1) * (rect.height - d) + "px";
      msgEl.style.display = "none";
    } else if (phase === "play" && !resolved) {
      dot.style.display = "none";
      msgEl.style.display = "flex"; msgEl.textContent = "赤丸が出るのを待っています...";
    }
  }
})();
</script>

</body>
